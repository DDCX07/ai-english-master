# ============================================================
# AI 学案生成 Worker（个性化学案 / AI 外刊精读）
# 部署：cd worker && npx wrangler deploy
# ============================================================
name = "ai-lesson-worker"
main = "src/index.js"
compatibility_date = "2026-08-01"

# 自定义域名：workers.dev 在国内被 DNS 污染，用户浏览器直连不了；
# 主域名的路径路由又和 Pages 自定义域名冲突（不生效），
# 所以给 Worker 绑独立子域名（Workers Custom Domain，DNS 记录自动创建）
# 注意：routes 必须放在所有 [[table]] 段之前
routes = [
  { pattern = "api.ai-college-study.com", custom_domain = true }
]

# KV 缓存：学案按 `lesson:{级别}:{日期}` 缓存 7 天
# 创建命令（已执行）：npx wrangler kv namespace create LESSONS
[[kv_namespaces]]
binding = "LESSONS"
id = "8b8b3eb87a4b4a779555b982988f0317"

# 定时预热：每天北京时间 00:30（UTC 16:30）自动生成三挡学案塞进 KV，
# 用户白天点击时直接读缓存，秒开
[triggers]
crons = ["30 16 * * *"]

# 智谱模型名，默认免费模型 glm-4-flash，可改成 glm-4-air 等
[vars]
MODEL = "glm-4-flash"
ZHIPU_URL = "https://open.bigmodel.cn/api/paas/v4/chat/completions"

# 密钥不上传到这个文件，部署后用下面的命令设置（交互式输入）：
#   npx wrangler secret put ZHIPU_API_KEY
