<!--
  按钮组件集合 (Button Components)
  包含多种常用的按钮样式
-->

<!-- ============================================================
  主按钮 (Primary Button)
  用途: 主要操作，如"提交"、"开始学习"等
  ============================================================ -->
<button class="ai-button ai-button--primary">
  <span>开始学习</span>
</button>

<!-- ============================================================
  次要按钮 (Secondary Button)
  用途: 次要操作，如"取消"、"返回"等
  ============================================================ -->
<button class="ai-button ai-button--secondary">
  <span>取消</span>
</button>

<!-- ============================================================
  文字按钮 (Text Button)
  用途: 不太重要的操作，如"查看更多"
  ============================================================ -->
<button class="ai-button ai-button--text">
  <span>查看更多</span>
</button>

<!-- ============================================================
  图标按钮 (Icon Button)
  用途: 仅显示图标的操作按钮
  ============================================================ -->
<button class="ai-icon-btn" aria-label="Settings">
  <span class="material-symbols-outlined">settings</span>
</button>

<!-- ============================================================
  带图标的按钮 (Button with Icon)
  ============================================================ -->
<button class="ai-button ai-button--primary">
  <span class="material-symbols-outlined ai-button__icon">play_arrow</span>
  <span>开始练习</span>
</button>

<!-- ============================================================
  全宽按钮 (Full Width Button)
  用途: 在表单或卡片中占满宽度的按钮
  ============================================================ -->
<button class="ai-button ai-button--primary ai-button--full">
  <span>提交答案</span>
</button>

<!-- ============================================================
  危险按钮 (Danger Button)
  用途: 删除、取消等危险操作
  ============================================================ -->
<button class="ai-button ai-button--danger">
  <span>删除</span>
</button>

<!-- ============================================================
  成功按钮 (Success Button)
  用途: 保存、完成等成功操作
  ============================================================ -->
<button class="ai-button ai-button--success">
  <span>保存</span>
</button>
